[project]
name = "privacy-policy-compliance"
version = "0.1.0"
description = "GDPR privacy-policy compliance assessment: RAG retrieval, LLM-judge fine-tuning, compliance scoring, and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
rag = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
]
judge = [
    # QLoRA fine-tuning + inference (Qwen2.5-7B-Instruct open-source model)
    "pyyaml>=6.0",
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "mlflow>=2.16.0",  # optional: local file-tracking-uri runs, no server required
]
scoring = [
    # compliance scoring engine
    "pyyaml>=6.0",
]
ui = [
    # Streamlit app (ui/app.py)
    "streamlit>=1.38.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "trafilatura>=1.8.0",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12.0",
    "lxml_html_clean>=0.1.0",
    "plotly>=5.20.0",
    "reportlab>=4.0.0",
]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "judge", "scoring", "ui", "eval"]
